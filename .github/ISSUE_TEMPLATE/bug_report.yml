name: Bug report / Reportar un error
description: Something doesn't work as expected. / Algo no funciona como esperabas.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in English or Spanish.
        ¡Gracias por reportar! Podés escribir en inglés o en español.
  - type: input
    id: version
    attributes:
      label: Venecita Dock version / Versión
      description: Tray menu › Settings, or `venecita status`. / Menú de la bandeja › Ajustes, o `venecita status`.
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / Sistema operativo
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Linux (X11)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / Versión del sistema
      placeholder: macOS 15.1, Windows 11 24H2…
  - type: textarea
    id: displays
    attributes:
      label: Displays / Pantallas
      description: Which monitors are connected, their resolution, and whether the laptop is open or closed. / Qué monitores están conectados, su resolución, y si la notebook está abierta o cerrada.
      placeholder: |
        Laptop closed. Dell 1080p on the left, LG 4K on the right.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened? / ¿Qué esperabas y qué pasó?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / Registro
      description: |
        Tray menu › Show logs. Paste the lines around the problem (they don't include window titles).
        Menú de la bandeja › Ver registros. Pegá las líneas alrededor del problema (no incluyen títulos de ventanas).
        - macOS: `~/Library/Logs/venecita-dock/`
        - Windows: `%LOCALAPPDATA%\venecita-dock\logs\`
        - Linux: `~/.local/state/venecita-dock/logs/`
      render: text
  - type: textarea
    id: config
    attributes:
      label: Configuration / Configuración
      description: |
        The relevant part of `config.toml` (displays, the layout in use). Never paste `token.secret`.
        La parte relevante de `config.toml` (pantallas, la distribución en uso). Nunca pegues `token.secret`.
      render: toml
