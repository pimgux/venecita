# Verificación: corre en cada push a main y en cada pull request.
#
# 1. Formato del código: que todo esté formateado con rustfmt.
# 2. Pruebas en macOS, Windows y Linux: advertencias (clippy) y pruebas.
# 3. Ejecutable de Windows: compila el .exe y lo deja para descargar (en la página de la
#    ejecución, sección "Artifacts"), para probarlo antes de publicar una versión.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  formato:
    name: Formato del código
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust (con rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Revisar el formato (cargo fmt)
        run: cargo fmt --all --check

  pruebas:
    name: Pruebas en ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: macOS
            runner: macos-latest
          - sistema: Windows
            runner: windows-latest
          - sistema: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust (con clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Reutilizar la compilación anterior (caché)
        uses: Swatinem/rust-cache@v2
      - name: Revisar advertencias (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Correr las pruebas (cargo test)
        run: cargo test --workspace
      # El contrato de la plataforma contra el escritorio real de la máquina de GitHub.
      - name: Probar contra el escritorio real de Windows
        if: runner.os == 'Windows'
        env:
          VENECITA_DESKTOP_TESTS: "1"
        run: cargo test -p venecita-platform --test windows_desktop

  ejecutable-windows:
    name: Ejecutable de Windows (para probar)
    runs-on: windows-latest
    needs: pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Reutilizar la compilación anterior (caché)
        uses: Swatinem/rust-cache@v2
      - name: Compilar venecita-dock.exe y venecita.exe (release)
        run: cargo build --release -p venecita-app --bin venecita-dock -p venecita-cli --bin venecita
      - name: Armar la carpeta con los archivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/venecita-dock.exe, target/release/venecita.exe dist/
          Copy-Item README.md, LICENSE, docs/API.md dist/
          Copy-Item examples/config.toml dist/config.example.toml
      - name: Dejar el ejecutable para descargar
        uses: actions/upload-artifact@v4
        with:
          name: venecita-dock-windows-x86_64
          path: dist/
