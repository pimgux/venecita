# Verificación: corre en cada push a main y en cada pull request.
#
# 1. Formato del código: que todo esté formateado con rustfmt.
# 2. Pruebas en macOS, Windows y Linux: advertencias (clippy), pruebas, y el contrato de la
#    plataforma contra un escritorio real (Windows) o virtual (X11 en Linux).
# 3. Paquetes para probar, antes de publicar una versión: el .exe y el instalador MSI de
#    Windows, y el DMG de macOS. Quedan para descargar en la página de la ejecución
#    (sección "Artifacts").
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  formato:
    name: Formato del código
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust (con rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Revisar el formato (cargo fmt)
        run: cargo fmt --all --check

  pruebas:
    name: Pruebas en ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: macOS
            runner: macos-latest
          - sistema: Windows
            runner: windows-latest
          - sistema: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust (con clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Reutilizar la compilación anterior (caché)
        uses: Swatinem/rust-cache@v2
      - name: Revisar advertencias (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Correr las pruebas (cargo test)
        run: cargo test --workspace
      # El contrato de la plataforma contra el escritorio real de la máquina de GitHub.
      - name: Probar contra el escritorio real de Windows
        if: runner.os == 'Windows'
        env:
          VENECITA_DESKTOP_TESTS: "1"
        run: cargo test -p venecita-platform --test windows_desktop
      # En Linux: un escritorio X11 virtual (Xvfb) con un gestor de ventanas (Openbox) y una
      # ventana de verdad (xterm), y la ventana se mueve para comprobar los bordes.
      - name: Preparar un escritorio X11 virtual
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xterm >/dev/null
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 openbox &
          sleep 2
          DISPLAY=:99 xterm -geometry 80x24+200+150 &
          sleep 2
      - name: Probar contra el escritorio X11
        if: runner.os == 'Linux'
        env:
          DISPLAY: ":99"
          VENECITA_DESKTOP_TESTS: "1"
          VENECITA_DESKTOP_MOVE: "1"
        run: cargo test -p venecita-platform --test x11_desktop -- --nocapture

  paquete-windows:
    name: Paquete de Windows (para probar)
    runs-on: windows-latest
    needs: pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Reutilizar la compilación anterior (caché)
        uses: Swatinem/rust-cache@v2
      - name: Compilar venecita-dock.exe y venecita.exe (release)
        run: cargo build --release -p venecita-app --bin venecita-dock -p venecita-cli --bin venecita
      - name: Instalar WiX 5 (para el instalador)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Armar la carpeta y el instalador (MSI)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/venecita-dock.exe, target/release/venecita.exe dist/
          Copy-Item README.md, LICENSE, docs/API.md dist/
          Copy-Item examples/config.toml dist/config.example.toml
          wix build wix/venecita.wxs -d Version=$version -d BinDir=target/release -o dist/venecita-dock.msi
      - name: Dejar los archivos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: venecita-dock-windows-x86_64
          path: dist/

  paquete-macos:
    name: App de macOS (para probar)
    runs-on: macos-latest
    needs: pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Reutilizar la compilación anterior (caché)
        uses: Swatinem/rust-cache@v2
      - name: Armar la app y el DMG
        run: scripts/bundle-macos.sh
      - name: Dejar el DMG para descargar
        uses: actions/upload-artifact@v4
        with:
          name: venecita-dock-macos
          path: dist/*.dmg
