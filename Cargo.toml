[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/pimgux/venecita"
authors = ["Venecita Dock contributors"]
rust-version = "1.80"

[workspace.dependencies]
venecita-core = { path = "crates/venecita-core" }
venecita-platform = { path = "crates/venecita-platform" }
venecita-api = { path = "crates/venecita-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "1"
tracing = "0.1"
proptest = "1"
fluent = "0.16"
unic-langid = "0.9"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
