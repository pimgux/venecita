[package]
name = "venecita-app"
description = "Venecita Dock desktop application (tray, hotkeys, overlays, settings)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "venecita_app"
path = "src/lib.rs"

[[bin]]
name = "venecita-dock"
path = "src/main.rs"

[dependencies]
venecita-core.workspace = true
venecita-platform.workspace = true
venecita-api = { workspace = true, features = ["server"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
notify = "8"
notify-debouncer-mini = "0.7"
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
fluent.workspace = true
unic-langid.workspace = true
global-hotkey = "0.9"

# The tray app and the settings window (macOS and Windows).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
egui.workspace = true
eframe.workspace = true
tray-icon = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.18"

[build-dependencies]
embed-manifest = "1.4"

# The Windows icon needs the resource compiler: only when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
