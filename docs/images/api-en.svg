</defs>
<rect x="0.5" y="0.5" width="959" height="259" rx="18" fill="url(#card)" stroke="#d6dde8"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="60" y="60" width="200" height="130" rx="14" fill="#0f172a" filter="url(#shadow)"/>
<rect x="78" y="78" width="48" height="42" rx="8" fill="#2f80ed"/>
<text x="102" y="106" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">⌂</text>
