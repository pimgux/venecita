<text x="102" y="158" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">⇄</text>
<rect x="136" y="130" width="48" height="42" rx="8" fill="#e5484d"/>
<text x="160" y="158" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">⏸</text>
