<text x="218" y="158" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">★</text>
<text x="160" y="220" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Stream deck, macro pad or script</text>
<line x1="280" y1="125" x2="660" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="112" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">local HTTP + WebSocket, with a token</text>
